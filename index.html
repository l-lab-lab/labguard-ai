<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智安实验室 LabGuard AI</title>
<style>body{font-family:Arial,"Microsoft YaHei";margin:0;background:#f1f6fb;color:#243b53}header{background:#193d68;color:#fff;padding:18px 6%;font-size:22px}nav,main{max-width:1100px;margin:auto}nav{padding:14px 0;display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:5px;padding:9px 14px;background:#347fbd;color:#fff;cursor:pointer}button.alt{background:#fff;color:#347fbd;border:1px solid #9dbbd3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #cbddea;border-radius:8px;padding:20px;margin-bottom:18px}label{display:block;margin:10px 0 5px;font-size:13px}input,select,textarea{width:100%;padding:9px;border:1px solid #b8cee0;border-radius:4px;box-sizing:border-box}textarea{min-height:70px}.page{display:none}.page.on{display:block}.tag{padding:4px 8px;border-radius:12px;font-size:12px;background:#fff0c9}.high{background:#ffe0dc}.low{background:#dff2e5}.row{border-bottom:1px solid #e4edf4;padding:12px 0}.muted{color:#6b7d8e;font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}main{padding:0 12px}}</style>
<header>智安实验室 <small>LabGuard AI · 共享云端平台</small></header><nav><button onclick="go('book')">预约申请</button><button onclick="go('mine')">我的申请</button><button onclick="go('admin')">管理员审批</button><button onclick="go('safe')">安全员复核</button><button onclick="go('dash')">数据看板</button><button onclick="go('kb')">帮助与规范</button></nav><main>
<section id="book" class="page on"><div class="grid"><div class="card"><h2>预约申请</h2><label>申请学生</label><input id="student" value="小王"><label>实验室</label><select id="lab"></select><label>设备</label><select id="device"></select><label>日期/时段</label><input id="slot" value="2026-11-10 14:00-16:00"><label>实验内容</label><input id="experiment" value="常规实验"><label>材料与操作</label><input id="materials" value="按规范操作"><label>培训资格</label><select id="training"><option value="1">已完成安全培训</option><option value="0">待核验</option></select><label>实验方案</label><textarea id="plan">已说明实验步骤和防护措施</textarea><label>废弃物处理</label><textarea id="waste">分类收集并按规定处置</textarea><button onclick="submitApp()">提交并进行AI预审</button></div><div class="card"><h2>AI预审结果</h2><div id="result">填写申请后提交，结果会同步到学生、管理员和安全员页面。</div></div></div></section>
<section id="mine" class="page"><div class="card"><h2>我的申请</h2><div id="mineList"></div></div></section><section id="admin" class="page"><div class="card"><h2>管理员审批</h2><p class="muted">中低风险由管理员处理，高风险转安全员。</p><div id="adminList"></div></div></section><section id="safe" class="page"><div class="card"><h2>安全员复核</h2><div id="safeList"></div></div></section><section id="dash" class="page"><div class="card"><h2>数据看板</h2><div id="stats"></div></div></section><section id="kb" class="page"><div class="card"><h2>帮助与规范知识库</h2><input id="q" placeholder="搜索：培训、废液、离心机、激光、应急"><button onclick="search()">查询</button><div id="kbList"></div></div></section></main>
<script>let C={};const $=x=>document.getElementById(x),api=(u,o)=>fetch(u,o).then(r=>r.json());function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');if(id==='mine'||id==='admin'||id==='safe')loadApps();if(id==='dash')loadStats();if(id==='kb')loadKb()}function esc(s){return String(s??'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}function risk(x){return `<span class="tag ${x.risk==='高风险'?'high':x.risk==='低风险'?'low':''}">${esc(x.risk)} ${x.score}分</span>`}async function init(){C=await api('/api/catalog');$('lab').innerHTML=Object.keys(C).map(x=>`<option>${x}</option>`);$('lab').onchange=()=>{$('device').innerHTML=C[$('lab').value].map(x=>`<option>${x}</option>`)};$('lab').onchange();loadKb()}function payload(){return {student:$('student').value,lab:$('lab').value,device:$('device').value,slot:$('slot').value,experiment:$('experiment').value,materials:$('materials').value,training:$('training').value,plan:$('plan').value,waste:$('waste').value}}async function submitApp(){let r=await api('/api/applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});$('result').innerHTML=`<p>${risk(r.analysis)} <b>${esc(r.analysis.status)}</b></p><p>原因：${r.analysis.reasons.map(esc).join('；')}</p><p>建议：${r.analysis.advice.map(esc).join('；')}</p><p class="muted">申请 #${r.id} 已同步到管理员审批和我的申请。</p>`;go('mine');loadApps()}function row(x,role){let act=role==='admin'?(x.risk==='高风险'?`<button class="alt" onclick="approve(${x.id},'待安全员复核')">转安全员</button>`:`<button onclick="approve(${x.id},'已通过')">通过</button> <button class="alt" onclick="approve(${x.id},'待补件')">补件</button> <button class="alt" onclick="approve(${x.id},'已驳回')">驳回</button>`):role==='safe'?`<button onclick="approve(${x.id},'已通过')">通过</button> <button class="alt" onclick="approve(${x.id},'已驳回')">驳回</button>`:'';return `<div class="row"><b>${esc(x.student)}</b> · ${esc(x.lab)} / ${esc(x.device)}<br><span class="muted">${esc(x.slot)} · ${esc(x.experiment)}</span><br>${risk(x)}　状态：<b>${esc(x.status)}</b> ${act}</div>`}async function loadApps(){let a=await api('/api/applications'),s=$('student').value;$('mineList').innerHTML=a.filter(x=>x.student===s).map(x=>row(x,'')).join('')||'暂无申请';$('adminList').innerHTML=a.map(x=>row(x,'admin')).join('')||'暂无申请';$('safeList').innerHTML=a.filter(x=>x.risk==='高风险'||x.status==='待安全员复核').map(x=>row(x,'safe')).join('')||'暂无高风险申请'}async function approve(id,status){await api('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});loadApps();loadStats()}async function loadStats(){let d=await api('/api/stats');$('stats').innerHTML=`总预约：<b>${d.total}</b>　低风险：${d.low}　中风险：${d.medium}　高风险：${d.high}<hr>待审批：${d.pending}　待补件：${d.supplement}　已通过：${d.approved}<h3>实验室</h3>${d.labs.map(x=>`${esc(x.label)}：${x.n}`).join('<br>')}<h3>设备</h3>${d.devices.map(x=>`${esc(x.label)}：${x.n}`).join('<br>')}`}async function loadKb(){let k=await api('/api/knowledge');$('kbList').innerHTML=k.map(x=>`<div class="row"><b>${esc(x.title)} · ${esc(x.clause)}</b><br>${esc(x.text)}<br><span class="muted">操作：${esc(x.operation)}</span></div>`).join('')}async function search(){let q=$('q').value.toLowerCase();let k=await api('/api/knowledge');$('kbList').innerHTML=k.filter(x=>(x.title+x.text+x.operation+x.tags).toLowerCase().includes(q)).map(x=>`<div class="row"><b>${esc(x.title)} · ${esc(x.clause)}</b><br>${esc(x.text)}<br>操作：${esc(x.operation)}</div>`).join('')||'未找到相关规范'}init();</script>
